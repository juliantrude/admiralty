<!doctype html>
<!--
  Hliðskjálf graph engine: one fixed page that draws one Solution Graph (docs/plans/M6.md).
  Libraries are pinned in engine/pins.json (exact versions + SRI); see engine/VERSIONS.md.
  The page takes its data from solution-graph.json and writes nothing but text into the DOM.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hliðskjálf — Solution Graph</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="engine.css">
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.34.4/dist/cytoscape.min.js" integrity="sha384-lyd1lDWZ623YSUJ/wMQH50y+T81dWKJk7ZoFdYWXQS83b0+QpW0pgdfXEnQnXL/X" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.12.0/lib/elk.bundled.js" integrity="sha384-ww57TDqx4cGknIavPm0QKO+aygLUR1BLSn2Vhbnt1XdYKWcwLyWTFKX7aZMaKIi2" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-elk@2.3.0/dist/cytoscape-elk.js" integrity="sha384-VCqo69qSTjiAwEkpykDLjsy96VKDH33my5mKmDfk3HhB85Iy4QwZ9R0IXqYuxV1A" crossorigin="anonymous"></script>
</head>
<body>
<main>
  <p id="error" role="alert" hidden></p>
  <div id="loader" hidden>
    <p>No <code>solution-graph.json</code> found next to this page. Choose a file or drop it here.</p>
    <input id="picker" type="file" accept=".json,application/json">
  </div>
  <header id="header" hidden>
    <h1>Hliðskjálf — Solution Graph</h1>
    <p id="header-text"></p>
  </header>
  <div id="stage">
    <div id="cy"></div>
    <aside id="panel" class="bubble" aria-live="polite" hidden><div id="panel-body"></div></aside>
  </div>
  <ul id="legend" aria-label="Legend"></ul>
  <section id="actions-section" hidden>
    <h2>Key Actions, ranked <span class="hint">(click one, or a node, to focus its chain and see its details; Esc closes)</span></h2>
    <ol id="key-actions"></ol>
  </section>
  <section id="pruned-section" hidden>
    <h2>Pruned (cut by the model, with the reason)</h2>
    <ul id="pruned"></ul>
  </section>
</main>
<pre id="engine-state" hidden></pre>
<!-- solution-graph -->
<script src="engine.js"></script>
</body>
</html>
