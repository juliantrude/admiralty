# Where a figure lives in the game's interface (M9, 20f; docs/plans/M9.md). Drafted from the files of
# the Player's install (4.5.2) only; no wiki text. Each entry names the files it rests on and a string
# that must occur in them (`find`), and tests/test_academy_locations.py checks both when the install
# is present. A figure without an entry falls back to its domain (academy/locations.py).
# Spot check by the Player: docs/awaiting-julian.md, "Abnahme".
version: v4.5.2
domains:
  energy:
    path: Top bar, the Energy figure (stored amount and monthly balance); a click opens the Market window
    sources:
    - file: interface/resource_groups/topbar_single_resource_groups.txt
      find: tb_energy_group
  minerals:
    path: Top bar, the Minerals figure (stored amount and monthly balance); a click opens the Market window
    sources:
    - file: interface/resource_groups/topbar_single_resource_groups.txt
      find: tb_mineral_group
  food:
