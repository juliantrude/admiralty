      find: planet_stability
  pop_growth:
    path: Planet window, the growth panel of the planet's population (growth progress and speed)
    sources:
    - file: interface/planet_view.gui
      find: growth_data
  jobs:
    path: Planet window, the jobs list of the planet (filled and open places)
    sources:
    - file: interface/planet_view.gui
      find: jobs_list
  slots:
    path: Planet window, the districts and the buildings of the planet; starbase slots in the Starbase window
    sources:
    - file: interface/planet_view.gui
      find: districts_window
    - file: interface/planet_view.gui
      find: buildings_box
  naval_capacity:
    path: Fleet Manager, the naval capacity line at the top; its tooltip explains the capacity
    sources:
    - file: interface/fleet_manager_view.gui
      find: naval_capacity
    - file: interface/fleet_manager_view.gui
      find: NAVY_SIZE_DESC
