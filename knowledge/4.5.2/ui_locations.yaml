      find: tb_research_group
  market:
    path: 'Market window (top bar: click Energy, Minerals, Food or Alloys); standing trades under Monthly Trade'
    sources:
    - file: interface/market_view.gui
      find: market_view
    - file: interface/monthly_trade_view.gui
      find: monthly_trade_view
  housing:
    path: Planet window, the housing line of the planet's population panel
    sources:
    - file: interface/planet_view.gui
      find: housing_needs
  amenities:
    path: Planet window, the amenities line of the planet's population panel
    sources:
