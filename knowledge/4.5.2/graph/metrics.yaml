# Metric registry for the Mechanics Graph (docs/plans/M4.md, "Curated graph").
# name -> where the value lives in the Snapshot extract (dotted path), plus its unit.
# tests/test_mechanics_graph.py checks every path against the reference extract, so a renamed
# extract field breaks loudly. Domains that need more metrics add them in their own increment.
version: v4.5.2
metrics:
  energy.stockpile: {path: resources.energy.stockpile, unit: energy}
  energy.income: {path: resources.energy.income, unit: energy per month}
  energy.expenses: {path: resources.energy.expenses, unit: energy per month}
  energy.net: {path: resources.energy.net, unit: energy per month}
  minerals.stockpile: {path: resources.minerals.stockpile, unit: minerals}
  minerals.income: {path: resources.minerals.income, unit: minerals per month}
  minerals.expenses: {path: resources.minerals.expenses, unit: minerals per month}
  minerals.net: {path: resources.minerals.net, unit: minerals per month}
  food.stockpile: {path: resources.food.stockpile, unit: food}
  food.income: {path: resources.food.income, unit: food per month}
  food.expenses: {path: resources.food.expenses, unit: food per month}
  food.net: {path: resources.food.net, unit: food per month}
  alloys.stockpile: {path: resources.alloys.stockpile, unit: alloys}
  alloys.income: {path: resources.alloys.income, unit: alloys per month}
  alloys.expenses: {path: resources.alloys.expenses, unit: alloys per month}
  alloys.net: {path: resources.alloys.net, unit: alloys per month}
  unity.stockpile: {path: resources.unity.stockpile, unit: unity}
  unity.income: {path: resources.unity.income, unit: unity per month}
  unity.expenses: {path: resources.unity.expenses, unit: unity per month}
  unity.net: {path: resources.unity.net, unit: unity per month}
  influence.stockpile: {path: resources.influence.stockpile, unit: influence}
  influence.income: {path: resources.influence.income, unit: influence per month}
  influence.expenses: {path: resources.influence.expenses, unit: influence per month}
  influence.net: {path: resources.influence.net, unit: influence per month}
  research.income:
    sum: [resources.physics_research.income, resources.society_research.income, resources.engineering_research.income]
    unit: research per month
  research.expenses:
    sum: [resources.physics_research.expenses, resources.society_research.expenses, resources.engineering_research.expenses]
    unit: research per month
  research.net:
    sum: [resources.physics_research.net, resources.society_research.net, resources.engineering_research.net]
    unit: research per month
  trade.net: {path: resources.trade.net, unit: trade per month}
  pops.total: {path: pops.total, unit: pops}
  pops.unemployed: {path: pops.unemployed, unit: pops}
  pops.unemployed_share:
    ratio: {numerator: pops.unemployed, denominator: pops.total}
    unit: fraction
  empire.size: {path: empire.empire_size, unit: empire size}
  naval_capacity.used: {path: naval_capacity.used, unit: naval capacity}
  naval_capacity.max: {path: naval_capacity.max, unit: naval capacity}
  naval_capacity.fill:
    ratio: {numerator: naval_capacity.used, denominator: naval_capacity.max}
    unit: fraction
  traditions.next_cost: {path: progression.next_tradition.cost, unit: unity}
  ascension.slots_free: {path: progression.ascension_slots.free, unit: ascension perk slots}
  traditions.trees_free: {path: progression.tradition_tree_slots.free, unit: tradition tree slots}
  traditions.discovery_left: {path: progression.discovery_traditions.left, unit: traditions}
  # technologies and Traditions still lacking for an unlock (extract section "unlocks")
  unlocks.decree_missing: {path: unlocks.will_to_power.missing, unit: technologies}
  unlocks.doctrine_missing: {path: unlocks.naval_doctrine.missing, unit: technologies}
  unlocks.growth_techs_missing: {path: unlocks.growth_techs.missing, unit: technologies}
  unlocks.assembly_missing: {path: unlocks.assembly_boosts.missing, unit: technologies and traditions}
  unlocks.generator_buildings_missing: {path: unlocks.generator_buildings.missing, unit: technologies and capital tiers}
  unlocks.food_processing_missing: {path: unlocks.food_processing.missing, unit: technologies and capital tiers}
  unlocks.purification_missing: {path: unlocks.purification.missing, unit: technologies and capital tiers}
  unlocks.lab_missing: {path: unlocks.research_labs.missing, unit: technologies and capital tiers}
  unlocks.unity_buildings_missing: {path: unlocks.unity_buildings.missing, unit: technologies and capital tiers}
  unlocks.housing_buildings_missing: {path: unlocks.housing_buildings.missing, unit: technologies and capital tiers}
  unlocks.logistics_office_missing: {path: unlocks.logistics_office.missing, unit: technologies}
  unlocks.capital_upgrade_missing: {path: unlocks.capital_upgrade.missing, unit: technologies and capital tiers}
  # free places to grow into (extract section "room")
  room.districts_free: {path: room.districts_free, unit: district slots}
  room.generator_free: {path: room.district_types_free.generator, unit: district slots}
  room.mining_free: {path: room.district_types_free.mining, unit: district slots}
  room.farming_free: {path: room.district_types_free.farming, unit: district slots}
  jobs.open_research:
    sum: [room.open_jobs_by_output.physics_research, room.open_jobs_by_output.society_research, room.open_jobs_by_output.engineering_research]
    unit: open job places
  jobs.open_unity: {path: room.open_jobs_by_output.unity, unit: open job places}
  jobs.open_amenities: {path: room.open_jobs_by_function.amenities, unit: open job places}
  jobs.open_order: {path: room.open_jobs_by_function.order, unit: open job places}
  housing.free: {path: room.housing_free, unit: housing}
  room.building_slots_free: {path: room.building_slots_free, unit: building slots}
  room.building_slots_free_foundry: {path: room.building_slots_free_by_family.foundry, unit: building slots}
  room.building_slots_free_research: {path: room.building_slots_free_by_family.research, unit: building slots}
  room.building_slots_free_unity: {path: room.building_slots_free_by_family.unity, unit: building slots}
  room.building_slots_free_order: {path: room.building_slots_free_by_family.order, unit: building slots}
  room.building_slots_free_housing: {path: room.building_slots_free_by_family.housing, unit: building slots}
  room.building_slots_free_growth: {path: room.building_slots_free_by_family.growth, unit: building slots}
  starbases.slots_free: {path: room.starbase_slots.free, unit: starbase module and building slots}
