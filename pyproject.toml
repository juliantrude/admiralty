[project]
name = "hlidskjalf"
version = "0.1.0"
description = "An AI system that helps you master Stellaris faster."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3,<3",  # 2.x renamed FastMCP to MCPServer
    "pyyaml>=6.0.3",
    "rust-parser",
]

[project.scripts]
hlidskjalf = "hlidskjalf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
# Pinned to the commit we tested against 4.5.2 saves (ADR 0001).
rust-parser = { git = "https://github.com/eliasdoehne/stellaris-dashboard", subdirectory = "stellarisdashboard/parsing/rust_parser", rev = "c8e2d47dc30910b7a544e4c0ed1ae99e0db2150d" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hlidskjalf"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter wraps code; long formulas in docstrings stay readable

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "saves: needs the reference saves in tests/fixtures/saves/",
]
